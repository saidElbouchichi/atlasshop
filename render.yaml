# Blueprint Render : API AtlasShop (dossier server/).
# Les valeurs marquées « sync: false » se saisissent dans le tableau de bord Render, jamais dans le dépôt.
services:
  - type: web
    name: atlasshop-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false
      # URL du site Vercel, sans slash final (plusieurs origines possibles, séparées par des virgules)
      - key: CLIENT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
